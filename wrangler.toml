name = "focuslane-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1


[vars]
ALLOWED_ORIGIN = "moz-extension://*"
